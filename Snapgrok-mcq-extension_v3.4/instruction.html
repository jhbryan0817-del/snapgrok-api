<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SnapGrok Instruction</title>
  <link rel="stylesheet" href="instruction.css">
</head>
<body>
  <main>
    <p class="description">The instruction below will be sent to the AI model along with the screenshot.</p>
    <textarea id="instruction" maxlength="12000" placeholder="Type here" autofocus></textarea>
    <p class="automatic-rule">SnapGrok automatically adds a final rule requiring only A, B, C, D, E, or F. F means inconclusive.</p>
    <div class="actions">
      <span id="status" role="status"></span>
      <button id="cancel" type="button">Cancel</button>
      <button id="save" type="button">Save</button>
    </div>
  </main>
  <script src="shared.js"></script>
  <script src="instruction.js"></script>
</body>
</html>
