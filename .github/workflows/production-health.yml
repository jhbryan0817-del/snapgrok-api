name: Production health

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check API aggregate readiness
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            --retry 2 --retry-delay 2 --retry-all-errors \
            https://snapgrok-api.onrender.com/api/health)"
          jq -e '.ok == true and .service == "zenaian-api"' <<<"$body" >/dev/null

      - name: Check public website
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            --retry 2 --retry-delay 2 --retry-all-errors \
            https://www.zenaian.com/api/health)"
          jq -e '.ok == true' <<<"$body" >/dev/null
