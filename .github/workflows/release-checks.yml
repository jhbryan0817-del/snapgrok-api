name: Release checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      main-database:
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_DB: zenaian_test_main
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zenaian_test_main"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      deletion-ledger-database:
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_DB: zenaian_test_ledger
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zenaian_test_ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: server
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zenaian_test_main
      TEST_DELETION_LEDGER_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/zenaian_test_ledger
      ALLOW_TEST_DATABASE_RESET: RESET_ZENAIAN_TEST_DATABASES
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Verify ordered database release gate
        run: npm run release:databases
        env:
          BILLING_MODE: test
          MIGRATION_BOOTSTRAP_RUNTIME_ROLES: "true"
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zenaian_test_main
          DATABASE_URL: postgresql://zenaian_ci_main_runtime:MainRuntimePasswordForCiOnly1234567890@127.0.0.1:5432/zenaian_test_main
          DATABASE_RUNTIME_ROLE: zenaian_ci_main_runtime
          PRIVACY_DELETION_LEDGER_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/zenaian_test_ledger
          PRIVACY_DELETION_LEDGER_DATABASE_URL: postgresql://zenaian_ci_ledger_runtime:LedgerRuntimePasswordForCiOnly123456789@127.0.0.1:5433/zenaian_test_ledger
          PRIVACY_DELETION_LEDGER_RUNTIME_ROLE: zenaian_ci_ledger_runtime
          PRIVACY_DELETION_LEDGER_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          PRIVACY_DELETION_LEDGER_ENCRYPTION_KEY_VERSION: "1"
      - name: Exercise database restore and deletion-ledger replay
        shell: bash
        env:
          MAIN_DATABASE_CONTAINER: ${{ job.services.main-database.id }}
          RECOVERY_DRILL_DATABASE_URL: postgresql://zenaian_ci_main_runtime:MainRuntimePasswordForCiOnly1234567890@127.0.0.1:5432/zenaian_test_main
          PRIVACY_DELETION_LEDGER_DATABASE_URL: postgresql://zenaian_ci_ledger_runtime:LedgerRuntimePasswordForCiOnly123456789@127.0.0.1:5433/zenaian_test_ledger
          PRIVACY_DELETION_LEDGER_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          PRIVACY_DELETION_LEDGER_ENCRYPTION_KEY_VERSION: "1"
          PRIVACY_ARCHIVE_HMAC_KEY: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
          BILLING_MODE: test
        run: |
          set -euo pipefail
          node scripts/recovery-drill-fixture.js seed
          docker exec "$MAIN_DATABASE_CONTAINER" \
            pg_dump --username postgres --format custom \
            --file /tmp/zenaian-recovery.dump zenaian_test_main
          node scripts/recovery-drill-fixture.js record
          docker exec "$MAIN_DATABASE_CONTAINER" \
            createdb --username postgres zenaian_test_restore
          docker exec "$MAIN_DATABASE_CONTAINER" \
            pg_restore --username postgres --dbname zenaian_test_restore \
            --no-owner --exit-on-error /tmp/zenaian-recovery.dump
          export DATABASE_URL="postgresql://zenaian_ci_main_runtime:MainRuntimePasswordForCiOnly1234567890@127.0.0.1:5432/zenaian_test_restore"
          npm run privacy:replay-deletions -- \
            --after=2000-01-01T00:00:00.000Z --dry-run
          npm run privacy:replay-deletions -- \
            --after=2000-01-01T00:00:00.000Z
          npm run privacy:replay-deletions -- \
            --after=2000-01-01T00:00:00.000Z
          export RECOVERY_DRILL_DATABASE_URL="$DATABASE_URL"
          node scripts/recovery-drill-fixture.js verify
      - run: npm audit --omit=dev --audit-level=low

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuemVuYWlhbi5jb20k
      NEXT_PUBLIC_CLERK_FRONTEND_API_URL: https://clerk.zenaian.com
      NEXT_PUBLIC_SITE_URL: https://www.zenaian.com
      NEXT_PUBLIC_API_URL: https://snapgrok-api.onrender.com
      NEXT_PUBLIC_EXTENSION_ID: jjgjlopdpefphgappfmkkkpiknpnoijb
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=low

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
      - run: node --check service-worker.js
      - run: node --check image-optimization.js
      - run: node --check retry-policy.js
      - run: node --test test/*.test.js
