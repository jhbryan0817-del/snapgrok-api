<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add context to Zenaian</title>
    <link rel="stylesheet" href="instruction.css" />
  </head>
  <body>
    <main class="editor-shell">
      <header class="editor-header">
        <div class="editor-mark"><span>z</span></div>
        <div>
          <span class="eyebrow">Add Context</span>
          <h1>Custom Instruction for AI</h1>
          <p>This context is optional. When it is empty, Zenaian sends its secure default instruction for one or several correct options.</p>
        </div>
      </header>

      <section class="editor-card">
        <label for="instruction">Optional context</label>
        <textarea id="instruction" maxlength="12000" placeholder="Optional example: Solve the question using standard undergraduate engineering conventions. Prioritize the wording shown in the screenshot." spellcheck="true"></textarea>
        <div class="textarea-meta">
          <span>Do not include API keys or account information.</span>
          <span id="counter">0 / 12,000</span>
        </div>
      </section>

      <div class="actions">
        <p id="message" role="status"></p>
        <button id="cancel" class="secondary" type="button">Cancel</button>
        <button id="save" class="primary" type="button">Save context</button>
      </div>
    </main>

    <script src="settings.js"></script>
    <script src="instruction.js"></script>
  </body>
</html>
