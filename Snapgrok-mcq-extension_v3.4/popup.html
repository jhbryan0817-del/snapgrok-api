<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SnapGrok MCQ</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <section class="legend" aria-label="Answer icon legend">
      <div class="answer-item"><img src="icons/answer-a32.png" alt=""><span>A</span></div>
      <div class="answer-item"><img src="icons/answer-b32.png" alt=""><span>B</span></div>
      <div class="answer-item"><img src="icons/answer-c32.png" alt=""><span>C</span></div>
      <div class="answer-item"><img src="icons/answer-d32.png" alt=""><span>D</span></div>
      <div class="answer-item"><img src="icons/answer-e32.png" alt=""><span>E</span></div>
      <div class="special-item"><img src="icons/inconclusive32.png" alt=""><span>Inconclusive</span></div>
      <div class="special-item"><img src="icons/system-error32.png" alt=""><span>System Error</span></div>
    </section>

    <section class="controls">
      <div class="shortcut-row">
        <span class="label">Full-screen</span>
        <button id="fullShortcut" class="shortcut-button" type="button">Assign</button>
      </div>
      <div class="shortcut-row">
        <span class="label">Select Zone</span>
        <button id="zoneShortcut" class="shortcut-button" type="button">Assign</button>
      </div>
      <button id="instructionButton" class="instruction-button" type="button">
        <span id="instructionText">Add Instruction</span>
      </button>
    </section>

    <p class="note">“Full-screen” captures the visible Chrome tab. Select Zone works on ordinary web pages.</p>
  </main>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
